name: Build & Test AutoType

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (macOS)
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pillow

      - name: Run Swift Tests
        run: |
          swift test

      - name: Build IME & Settings App
        run: |
          bash Scripts/package_ime.sh
          bash Scripts/package_app.sh

      - name: Package Distributable Zip
        run: |
          cd .build/dist
          zip -r AutoType-macOS.zip "AutoType.app" "AutoType Settings.app"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoType-macOS
          path: .build/dist/AutoType-macOS.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: .build/dist/AutoType-macOS.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
